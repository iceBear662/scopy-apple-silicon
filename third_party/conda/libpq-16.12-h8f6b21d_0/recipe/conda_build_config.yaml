CI: azure
CONDA_BUILD_SYSROOT: /opt/conda-sdks/MacOSX11.0.sdk
MACOSX_DEPLOYMENT_TARGET: '11.0'
MACOSX_SDK_VERSION: '11.0'
build_platform: osx-64
c_compiler: clang
c_compiler_version: '20.1'
c_stdlib: macosx_deployment_target
c_stdlib_version: '11.0'
channel_sources: conda-forge
channel_targets: conda-forge main
cpu_optimization_target: nocona
cran_mirror: https://cran.r-project.org
cxx_compiler: clangxx
cxx_compiler_version: '20.1'
extend_keys:
- extend_keys
- ignore_build_only_deps
- pin_run_as_build
- ignore_version
fortran_compiler: gfortran
ignore_build_only_deps:
- python
- numpy
krb5: '1.21'
libpq: '17'
libuuid: '2'
libxml2_devel: '2.14'
lld: '20.1'
lua: '5'
macos_machine: arm64-apple-darwin20.0.0
numpy: '1.26'
openssl: '3.5'
perl: 5.26.2
pin_run_as_build:
  python:
    max_pin: x.x
    min_pin: x.x
  r-base:
    max_pin: x.x
    min_pin: x.x
postgresql: '17'
python: 3.14.* *_cp314
r_base: '3.5'
readline: '8'
target_platform: osx-arm64
zip_keys:
- - c_compiler_version
  - cxx_compiler_version
zlib: '1'
