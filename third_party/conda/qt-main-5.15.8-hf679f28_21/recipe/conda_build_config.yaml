CI: azure
CONDA_BUILD_SYSROOT: /Applications/Xcode_13.2.1.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX11.0.sdk
MACOSX_DEPLOYMENT_TARGET: '11.0'
MACOSX_SDK_VERSION: '10.14'
build_platform: osx-64
c_compiler: clang
c_compiler_version: '15'
c_stdlib: macosx_deployment_target
c_stdlib_version: '11.0'
channel_sources: conda-forge
channel_targets: conda-forge main
cpu_optimization_target: nocona
cran_mirror: https://cran.r-project.org
cxx_compiler: clangxx
cxx_compiler_version: '15'
extend_keys:
- ignore_build_only_deps
- pin_run_as_build
- extend_keys
- ignore_version
fortran_compiler: gfortran
glib: '2'
gstreamer: '1.24'
icu: '73'
ignore_build_only_deps:
- python
- numpy
krb5: '1.21'
libjpeg_turbo: '3'
libpng: '1.6'
libsqlite: '3'
lua: '5'
macos_machine: arm64-apple-darwin20.0.0
nspr: '4'
nss: '3'
numpy: '1.22'
perl: 5.26.2
pin_run_as_build:
  python:
    min_pin: x.x
    max_pin: x.x
  r-base:
    min_pin: x.x
    max_pin: x.x
postgresql: '16'
python: '3.10'
r_base: '3.5'
replacements:
  all_replacements:
  - - tag
    - glob_patterns
    - regex_re
    - replacement_re
  - - tag
    - glob_patterns
    - regex_re
    - replacement_re
    - regex_rg
target_platform: osx-arm64
zip_keys:
- - c_compiler_version
  - cxx_compiler_version
zlib: '1.2'
zstd: '1.5'
