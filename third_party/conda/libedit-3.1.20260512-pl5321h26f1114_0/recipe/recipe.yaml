context:
  version: "3.1"
  date: 20260512

package:
  name: libedit
  version: ${{ version }}.${{ date }}

source:
  url: http://thrysoee.dk/editline/libedit-${{ date }}-${{ version }}.tar.gz
  sha256: 432d5e7ea8b0116dd39f2eca7bc11d0eed77faa6b77ea526ace89907c23ea4a0

build:
  number: 0
  skip: win

requirements:
  build:
    - if: unix
      then: libtool
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - automake
    - perl
    - make
    - m4
  host:
    - ncurses
  run:
    - ncurses
  run_exports:
    - ${{ pin_subpackage('libedit', upper_bound='x.x') }}

tests:
  - script:
      - if: unix
        then:
          - test -f $PREFIX/lib/libedit${SHLIB_EXT}
          - test ! -f $PREFIX/lib/libedit.a
about:
  license: BSD-2-Clause
  license_file: COPYING
  summary: Editline Library (libedit)
  description: |
    This is an autotool- and libtoolized port of the NetBSD Editline library
    (libedit). This Berkeley-style licensed command line editor library provides
    generic line editing, history, and tokenization functions, similar to those
    found in GNU Readline


  homepage: http://thrysoee.dk/editline/

extra:
  recipe-maintainers:
    - djsutherland
    - scopatz
    - zbowling
    - h-vetinari
